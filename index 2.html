<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Abrindo acesso</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 48%, rgba(112,35,151,.20), transparent 35%),
      linear-gradient(180deg,#09010e 0%,#120319 50%,#08010d 100%);
    color:#fff;
  }

  .card{
    width:min(92vw,740px);
    min-height:620px;
    padding:72px 52px 58px;
    border:2px solid rgba(190,94,255,.28);
    border-radius:72px;
    background:
      radial-gradient(circle at 50% 20%,rgba(135,45,180,.20),transparent 35%),
      linear-gradient(135deg,rgba(72,30,93,.76),rgba(22,7,31,.92));
    box-shadow:0 0 70px rgba(150,42,210,.12), inset 0 0 60px rgba(174,72,220,.05);
    text-align:center;
  }

  .lock{
    width:174px;height:174px;
    margin:0 auto 48px;
    border-radius:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:74px;
    background:linear-gradient(145deg,#66229a,#2a1240);
    border:2px solid rgba(205,99,255,.28);
    box-shadow:0 0 35px rgba(184,63,255,.18);
    position:relative;
  }

  .lock:before{
    content:"";
    position:absolute;
    inset:20px;
    border-radius:50%;
    border:8px solid rgba(177,73,234,.22);
    border-top-color:#df65ff;
    border-left-color:#c24dff;
    transform:rotate(-35deg);
  }

  .lock span{position:relative;z-index:2}

  h1{
    margin:0 0 20px;
    font-size:clamp(38px,7vw,62px);
    line-height:1.05;
    font-weight:800;
    letter-spacing:-1.5px;
  }

  .subtitle{
    margin:0 0 58px;
    color:#d4bfdc;
    font-size:clamp(21px,4vw,30px);
    font-weight:600;
  }

  .progress{
    width:100%;
    height:24px;
    padding:3px;
    border-radius:999px;
    background:rgba(255,255,255,.08);
    overflow:hidden;
    box-shadow:inset 0 0 10px rgba(0,0,0,.3);
  }

  .bar{
    height:100%;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg,#b642ff,#d57cff);
    box-shadow:0 0 20px rgba(205,76,255,.8);
    animation:load 2.8s ease-in-out forwards;
  }

  .status{
    margin-top:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    color:#aa99b7;
    font-size:clamp(18px,3.5vw,25px);
    font-weight:800;
    letter-spacing:2px;
  }

  .dot{
    width:18px;height:18px;border-radius:50%;
    background:#46d7a0;
    box-shadow:0 0 18px #46d7a0;
  }

  @keyframes load{
    0%{width:0%}
    100%{width:100%}
  }

  @media(max-width:600px){
    .card{
      width:90vw;
      min-height:0;
      padding:58px 30px 48px;
      border-radius:48px;
    }
    .lock{
      width:145px;height:145px;
      border-radius:40px;
      font-size:62px;
      margin-bottom:42px;
    }
    .lock:before{inset:17px;border-width:7px}
    .subtitle{margin-bottom:48px}
    .progress{height:20px}
    .status{margin-top:34px;font-size:16px;gap:12px}
    .dot{width:15px;height:15px}
  }
</style>
</head>
<body>
  <main class="card">
    <div class="lock"><span>🔒</span></div>

    <h1>Abrindo acesso</h1>
    <p class="subtitle">Abrindo o Telegram...</p>

    <div class="progress" aria-label="Carregando">
      <div class="bar"></div>
    </div>

    <div class="status">
      <span class="dot"></span>
      <span>CONEXÃO SEGURA</span>
    </div>
  </main>

<script>
  const telegram = "https://t.me/+58V4Nz0MWZRlMDhh";

  // Abre o convite do Telegram após a animação.
  setTimeout(() => {
    window.location.href = telegram;
  }, 3000);
</script>
</body>
</html>
